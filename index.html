<!DOCTYPE html>
<html class="theme-light" data-active-theme="light">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="page-title">Résumé</title>
    <script>
    (function () {
        var theme = localStorage.getItem('resume.activeAppearance');
        if (theme !== 'dark' && theme !== 'light') theme = 'light';
        document.documentElement.className = 'theme-' + theme;
        document.documentElement.dataset.activeTheme = theme;
    })();
    </script>
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700&display=swap" rel="stylesheet">
    <link href="./style.css" rel="stylesheet" type="text/css">
    <script src="./script.js"></script>
</head>
<body class="theme-light">
<script>
(function () {
    var theme = document.documentElement.dataset.activeTheme || 'light';
    document.body.className = 'theme-' + theme;
    document.body.dataset.activeTheme = theme;
})();
</script>
<nav id="resume-toolbar" class="resume-toolbar" aria-label="Résumé controls">
    <label class="toolbar-control toolbar-profile" for="profile-select">
        <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.33 0-10 1.67-10 5v1h20v-1c0-3.33-6.67-5-10-5z"/>
        </svg>
        <span class="toolbar-label">Profile</span>
        <select id="profile-select" aria-label="Profile"></select>
    </label>
    <button type="button" id="preview-toggle" class="toolbar-btn" aria-pressed="false" aria-label="Preview">
        <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 5-5 5 5 0 0 1-5 5zm0-8a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/>
        </svg>
        <span class="toolbar-btn-label">Preview</span>
    </button>
    <button type="button" id="theme-toggle" class="toolbar-btn" aria-pressed="false" aria-label="Dark">
        <svg class="toolbar-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12.7 2.3a1 1 0 0 0-1.1.2 8.5 8.5 0 1 0 10 10 1 1 0 0 0-1.2-1.3 6.5 6.5 0 0 1-7.7-9z"/>
        </svg>
        <svg class="toolbar-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 7.5a4.5 4.5 0 1 0 4.5 4.5A4.5 4.5 0 0 0 12 7.5zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 3.8 6.3 5.9 4.9 7.3 2.8 5.2zm13.5 13.5 2.1 2.1-1.4 1.4-2.1-2.1zM19.8 3.8 21.2 5.2 19.1 7.3 17.7 5.9zM4.2 20.2 5.6 18.8 7.7 20.9 6.3 22.3z"/>
        </svg>
        <span class="toolbar-btn-label">Dark</span>
    </button>
</nav>
<div class="preview-page">
    <div class="page-content">
        <div class="header">
            <div class="name">
                <h1 id="name"></h1>
            </div>
            <div class="top-right"></div>
        </div>
        <div class="statement">
            <blockquote>
                <p id="summary"></p>
            </blockquote>
        </div>
        <div id="dynamic-sections"></div>
    </div>
</div>
</body>
</html>
